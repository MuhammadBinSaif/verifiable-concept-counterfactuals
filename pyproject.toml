[project]
name = "verifiable-concept-counterfactuals"
version = "0.1.0"
description = "Two-stage ZKP verification of concept-level counterfactual explanations"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
